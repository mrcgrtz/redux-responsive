name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Use Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Update npm
              run: npm install --global npm@latest
            - name: Installation
              run: npm ci
            - name: Typecheck
              run: npm run typecheck
            - name: Lint
              run: npm run lint
            - name: Test
              run: npm run test:coverage
            - name: Build
              run: npm run build
            - name: Package
              run: npm pack --dry-run
            - name: Coveralls
              uses: coverallsapp/github-action@v2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
