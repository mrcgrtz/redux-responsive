name: Publish

on:
    release:
        types: [published]

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Use Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org
            - name: Update npm
              run: npm install --global npm@latest
            - name: Installation
              run: npm ci
            - name: Check release tag
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$version" ]; then
                      echo "::error::Release tag $TAG does not match package.json ($version)"
                      exit 1
                  fi
              env:
                  TAG: ${{ github.event.release.tag_name }}
            - name: Check npm for this version
              id: npm
              run: |
                  spec="$(node -p "const {name, version} = require('./package.json'); name + '@' + version")"
                  if npm view "$spec" version > /dev/null 2>&1; then
                      echo "::notice::$spec is already published, skipping"
                      echo "published=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Test
              run: npm run check
            # `prepack` builds dist/; trusted publishing (OIDC) adds provenance
            - name: Publish
              if: steps.npm.outputs.published != 'true'
              run: npm publish
